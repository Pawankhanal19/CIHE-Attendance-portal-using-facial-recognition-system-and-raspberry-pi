<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>CIHE Attendance App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Apply saved theme + accent before React renders to prevent flash -->
  <script>(function(){var t=localStorage.getItem('ap-theme')||'light';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);var a=localStorage.getItem('ap-accent');if(a)document.documentElement.style.setProperty('--primary',a);})()</script>

  <!-- React & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Socket.IO client for live backend updates -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    Load each component file in order (dependencies first).
    type="text/babel" tells Babel to compile the JSX.
  -->
  <script src="frontend/api.js?v=8"></script>
  <script type="text/babel" src="components/Sidebar.jsx?v=7"></script>
  <script type="text/babel" src="components/SettingsPanel.jsx?v=7"></script>
  <script type="text/babel" src="pages/Login.jsx?v=7"></script>
  <script type="text/babel" src="pages/StudentPortal.jsx?v=8"></script>
  <script type="text/babel" src="pages/LecturerPortal.jsx?v=8"></script>
  <script type="text/babel" src="pages/AdminPortal.jsx?v=8"></script>
  <script type="text/babel" src="App.jsx?v=7"></script>
</body>
</html>
